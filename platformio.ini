; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two envs, same firmware. USB is the default - a bare `pio run -t upload` flashes
; over USB and does NOT touch the OTA env.
;
;   pio run -t upload                              -> flash over USB   (default)
;   pio run -e waveshare-esp32-s3-eth-ota -t upload -> flash over WiFi (opt-in)
;
; OTA only works once the board is already running firmware that contains ArduinoOTA,
; so the first flash of a blank board must always go over USB.

[platformio]
default_envs = waveshare-esp32-s3-eth

[env:waveshare-esp32-s3-eth]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Deliberately no upload_port here: the ESP32-S3's native USB re-enumerates on every
; reset and Windows can assign it a different COM number each time. Let PlatformIO
; auto-detect it. Only pin upload_port if you have several boards attached at once.

lib_deps =
	tzapu/WiFiManager
	bblanchon/ArduinoJson
	CRC32

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1

; --- OTA: same build, uploaded over the network ---
; Must match OTA_HOSTNAME / OTA_PASSWORD in src/main.cpp.
; If solar-display.local does not resolve, put the device's IP in upload_port instead.
[env:waveshare-esp32-s3-eth-ota]
extends = env:waveshare-esp32-s3-eth
upload_protocol = espota
upload_port = solar-display.local
upload_flags =
	--auth=changeme