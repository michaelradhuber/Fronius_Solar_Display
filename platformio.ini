; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two envs, same firmware. USB is the default - a bare `pio run -t upload` flashes
; over USB and does NOT touch the OTA env.
;
;   pio run -t upload                         -> flash over USB   (default)
;   pio run -e esp32-wroom-32-ota -t upload   -> flash over WiFi (opt-in)
;
; OTA only works once the board is already running firmware that contains ArduinoOTA,
; so the first flash of a blank board must always go over USB.

[platformio]
default_envs = esp32-wroom-32

[env:esp32-wroom-32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 4 MB flash, no PSRAM - the whole S3 memory block (qio_opi / psram_type / 16MB /
; default_16MB.csv) is gone with the S3.
;
; min_spiffs, not the default: the stock 4 MB layout gives each OTA slot 1'310'720 B
; and this firmware is already ~1'220'000 B, i.e. 93% full - the next feature would
; break OTA with a linker error that reads like a code problem. min_spiffs gives
; 1'966'080 B per slot. Nothing here uses SPIFFS/LittleFS, so the shrunken data
; partition costs us nothing.
board_build.partitions = min_spiffs.csv

; No upload_port pinned. Unlike the S3's native USB, the DevKit's CP2102/CH340 bridge
; keeps a stable COM number across resets, so pinning one would now be safe - it is
; just unnecessary. Pin it only if several boards are attached at once.
;
; If uploads prove flaky on this cable, drop the speed: v1 ran this board at
; upload_speed = 256000.

lib_deps =
	tzapu/WiFiManager
	bblanchon/ArduinoJson
	CRC32

; --- OTA: same build, uploaded over the network ---
; Must match OTA_HOSTNAME / OTA_PASSWORD in src/main.cpp.
; If solar-display.local does not resolve, put the device's IP in upload_port instead.
[env:esp32-wroom-32-ota]
extends = env:esp32-wroom-32
upload_protocol = espota
upload_port = solar-display.local
upload_flags =
	--auth=changeme
